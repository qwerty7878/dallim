# Local development profile (default).
# Run with: ./gradlew run
# For prod, point EngineMain at the prod file instead:
#   ./gradlew run -PconfigFile=application-prod.conf
# or (packaged jar): java -jar dallim-backend.jar -config=application-prod.conf

ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        watch = [classes]
    }
    application {
        modules = [com.dallim.ApplicationKt.module]
    }
}

dallim {
    profile = "local"

    jwt {
        secret = "dev-local-secret-change-me"
        secret = ${?JWT_SECRET}
        issuer = "dallim"
        audience = "dallim-app"
        realm = "dallim-api"
        accessTokenExpiryMinutes = 120
        refreshTokenExpiryDays = 30
    }

    database {
        jdbcUrl = "jdbc:postgresql://localhost:5432/dallim"
        jdbcUrl = ${?DATABASE_URL}
        user = "dallim"
        user = ${?DATABASE_USER}
        password = "dallim"
        password = ${?DATABASE_PASSWORD}
        maxPoolSize = 10
    }

    redis {
        uri = "redis://localhost:6379"
        uri = ${?REDIS_URL}
    }

    oauth {
        google {
            # audience(client id) used to verify the Google ID Token
            clientId = "REPLACE_WITH_GOOGLE_CLIENT_ID"
            clientId = ${?GOOGLE_CLIENT_ID}
        }
        kakao {
            userInfoUrl = "https://kapi.kakao.com/v2/user/me"
        }
    }

    osrm {
        baseUrl = "http://localhost:5001"
        baseUrl = ${?OSRM_BASE_URL}
    }

    fcm {
        # Local default: scripts/dev-backend.sh / `./gradlew run` both run with cwd=backend/, so
        # this relative path resolves to backend/secrets/firebase-adminsdk.json -- the Firebase
        # Admin SDK service account key a local developer already dropped in there (gitignored
        # via backend/.gitignore, never commit the real file).
        credentialsPath = "secrets/firebase-adminsdk.json"
        credentialsPath = ${?FCM_CREDENTIALS_PATH}
    }

    kakao {
        # docs/02-api-spec.md 12.2 -- REST API key for Kakao Local keyword search (place search,
        # GET /routes/places/search), separate from oauth.kakao's login key above. Blank/unset is
        # a valid local-dev default: com.dallim.common.KakaoLocalClient skips the Kakao call and
        # returns no results rather than failing (12.1's soft-fail policy).
        localApiKey = ""
        localApiKey = ${?KAKAO_LOCAL_REST_API_KEY}
    }

    cors {
        allowedHosts = ["localhost:3000"]
    }
}
