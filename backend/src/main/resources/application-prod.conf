# Production profile — all secrets MUST come from environment variables.
# Never commit real prod secrets to this file.
#
# Deploy usage (packaged jar on EC2):
#   java -jar dallim-backend.jar -config=application-prod.conf

ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        watch = []
    }
    application {
        modules = [com.dallim.ApplicationKt.module]
    }
}

dallim {
    profile = "prod"

    jwt {
        secret = ${JWT_SECRET}
        issuer = "dallim"
        audience = "dallim-app"
        realm = "dallim-api"
        accessTokenExpiryMinutes = 120
        refreshTokenExpiryDays = 30
    }

    database {
        jdbcUrl = ${DATABASE_URL}
        user = ${DATABASE_USER}
        password = ${DATABASE_PASSWORD}
        maxPoolSize = 20
    }

    redis {
        uri = ${REDIS_URL}
    }

    oauth {
        google {
            clientId = ${GOOGLE_CLIENT_ID}
        }
        kakao {
            userInfoUrl = "https://kapi.kakao.com/v2/user/me"
        }
    }

    osrm {
        baseUrl = "http://localhost:5001"
        baseUrl = ${?OSRM_BASE_URL}

        # docs/02-api-spec.md 13.2 -- SHAPE-mode discovery's dedicated instance.
        shapeBaseUrl = "http://localhost:5002"
        shapeBaseUrl = ${?OSRM_SHAPE_BASE_URL}
    }

    fcm {
        credentialsPath = ${FCM_CREDENTIALS_PATH}
    }

    kakao {
        # docs/02-api-spec.md 12.2 -- optional: unset means place search soft-fails to items: []
        # (com.dallim.common.KakaoLocalClient), so this deliberately does NOT use the required
        # ${VAR} form other prod secrets above use -- place search is a supporting feature, its
        # key missing should never block a deploy.
        localApiKey = ""
        localApiKey = ${?KAKAO_LOCAL_REST_API_KEY}
    }

    cors {
        allowedHosts = ${CORS_ALLOWED_HOSTS}
    }
}
