# Test profile for RunFlowIntegrationTest / com.dallim.testsupport.ApiTestSupport.
#
# Identical to src/main/resources/application.conf (same local docker-compose Postgres/Redis --
# see scripts/dev-db.sh) EXCEPT maxPoolSize is drastically smaller. Each `testApplication { }`
# block runs the REAL com.dallim.module(), which opens a brand-new HikariCP pool and never closes
# it (module() has no shutdown hook wired to the test host's lifecycle) -- with ~15 integration
# tests all doing this in one JVM run, the default maxPoolSize=10 quickly exhausts Postgres's
# max_connections and later tests fail with HikariPool$PoolInitializationException. A pool size
# of 2 keeps the cumulative leak well under the default max_connections=100 for a full test run.
#
# NOTE for backend-dev: this is a workaround, not a fix -- module() should register
# `environment.monitor.subscribe(ApplicationStopping) { dataSource.close(); ... }` so the
# DataSource/Redis connection actually get released on shutdown (relevant in prod too, e.g. a
# graceful redeploy). See docs/qa-checklist.md.
ktor {
    deployment {
        port = 8080
        watch = []
    }
    application {
        modules = [com.dallim.ApplicationKt.module]
    }
}

dallim {
    profile = "test"

    jwt {
        secret = "test-secret-not-for-prod"
        issuer = "dallim"
        audience = "dallim-app"
        realm = "dallim-api"
        accessTokenExpiryMinutes = 120
        refreshTokenExpiryDays = 30
    }

    database {
        jdbcUrl = "jdbc:postgresql://localhost:5432/dallim"
        user = "dallim"
        password = "dallim"
        maxPoolSize = 2
    }

    redis {
        uri = "redis://localhost:6379"
    }

    oauth {
        google {
            clientId = "REPLACE_WITH_GOOGLE_CLIENT_ID"
        }
        kakao {
            userInfoUrl = "https://kapi.kakao.com/v2/user/me"
        }
    }

    cors {
        allowedHosts = ["localhost:3000"]
    }
}
