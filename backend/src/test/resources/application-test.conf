# Test profile for RunFlowIntegrationTest / com.dallim.testsupport.ApiTestSupport.
#
# Identical to src/main/resources/application.conf (same local docker-compose Postgres/Redis --
# see scripts/dev-db.sh) EXCEPT maxPoolSize is kept small. Each `testApplication { }` block runs
# the REAL com.dallim.module(), which opens a brand-new HikariCP pool -- com.dallim.Application's
# module() now closes it on ApplicationStopping (2026-09-05, see that file's comment), so pools no
# longer accumulate across the JVM run, but a small pool size here still keeps any one moment's
# concurrent test load comfortably under the default max_connections=100.
ktor {
    deployment {
        port = 8080
        watch = []
    }
    application {
        modules = [com.dallim.ApplicationKt.module]
    }
}

dallim {
    profile = "test"

    jwt {
        secret = "test-secret-not-for-prod"
        issuer = "dallim"
        audience = "dallim-app"
        realm = "dallim-api"
        accessTokenExpiryMinutes = 120
        refreshTokenExpiryDays = 30
    }

    database {
        jdbcUrl = "jdbc:postgresql://localhost:5432/dallim"
        user = "dallim"
        password = "dallim"
        maxPoolSize = 2
    }

    redis {
        uri = "redis://localhost:6379"
    }

    oauth {
        google {
            clientId = "REPLACE_WITH_GOOGLE_CLIENT_ID"
        }
        kakao {
            userInfoUrl = "https://kapi.kakao.com/v2/user/me"
        }
    }

    osrm {
        baseUrl = "http://localhost:5001"
        baseUrl = ${?OSRM_BASE_URL}

        # docs/02-api-spec.md 13.2 -- SHAPE-mode discovery's dedicated instance.
        shapeBaseUrl = "http://localhost:5002"
        shapeBaseUrl = ${?OSRM_SHAPE_BASE_URL}
    }

    fcm {
        # Deliberately a nonexistent path (even on a machine that has a real
        # backend/secrets/firebase-adminsdk.json for local `./gradlew run`) so the integration
        # test suite runs with com.dallim.push.FirebaseFcmSender's "no credentials -> disabled,
        # send() is a no-op" branch -- no real network calls to Firebase from tests, no flakiness.
        credentialsPath = "secrets/does-not-exist-for-tests.json"
    }

    kakao {
        # Deliberately blank -- com.dallim.common.KakaoLocalClient skips the real Kakao call and
        # returns no results, same "no real network calls from tests" intent as fcm above.
        localApiKey = ""
    }

    cors {
        allowedHosts = ["localhost:3000"]
    }
}
